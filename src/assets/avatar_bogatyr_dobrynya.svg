<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-dobrynya" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="70%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </radialGradient>
    <linearGradient id="helm-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="85%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="cloak-ruby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="60%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="skin-dobrynya" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="hair-blond" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="shadow-d" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="60" cy="60" r="58" fill="url(#bg-dobrynya)" stroke="#eab308" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="54" fill="none" stroke="#fde047" stroke-width="0.75" stroke-dasharray="4,2" opacity="0.65"/>

  <!-- Ruby Cloak / Mantle -->
  <path d="M 18 116 C 18 88 34 76 60 76 C 86 76 102 88 102 116 Z" fill="url(#cloak-ruby)" filter="url(#shadow-d)"/>
  <!-- Cloak Folds -->
  <path d="M 38 88 Q 30 102 24 116 M 82 88 Q 90 102 96 116" stroke="#7f1d1d" stroke-width="2.5" fill="none"/>

  <!-- Golden Gemstone Fibula (Brooch) on Right Shoulder -->
  <circle cx="38" cy="84" r="7" fill="url(#helm-gold)" filter="url(#shadow-d)"/>
  <circle cx="38" cy="84" r="3.5" fill="#b91c1c"/>
  <circle cx="38" cy="84" r="1" fill="#fef08a"/>

  <!-- Chainmail / Neck Guard -->
  <path d="M 42 56 L 38 80 L 82 80 L 78 56 Z" fill="#64748b"/>
  <path d="M 40 64 Q 60 72 80 64 M 38 72 Q 60 80 82 72" stroke="#94a3b8" stroke-width="1.2" fill="none"/>

  <!-- Noble Face Base -->
  <path d="M 44 46 C 44 64 50 74 60 74 C 70 74 76 64 76 46 C 76 36 70 32 60 32 C 50 32 44 36 44 46 Z" fill="url(#skin-dobrynya)"/>

  <!-- Eyes & Noble Eyebrows -->
  <path d="M 47 46 Q 53 43 57 46" stroke="#92400e" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 73 46 Q 67 43 63 46" stroke="#92400e" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Blue Eyes -->
  <ellipse cx="52" cy="50" rx="3.5" ry="2.2" fill="#fff"/>
  <circle cx="52.5" cy="50" r="1.6" fill="#0284c7"/>
  <circle cx="52.8" cy="49.3" r="0.6" fill="#fff"/>
  <ellipse cx="68" cy="50" rx="3.5" ry="2.2" fill="#fff"/>
  <circle cx="67.5" cy="50" r="1.6" fill="#0284c7"/>
  <circle cx="67.2" cy="49.3" r="0.6" fill="#fff"/>
  <!-- Nose -->
  <path d="M 59 47 L 58 57 L 62 57 Z" fill="#ea580c" opacity="0.3"/>
  <path d="M 58 56 Q 60 58 62 56" stroke="#c2410c" stroke-width="1.3" fill="none" stroke-linecap="round"/>

  <!-- Neat Trimmed Beard & Golden Mustache -->
  <!-- Trimmed Beard -->
  <path d="M 48 64 C 48 76 54 84 60 84 C 66 84 72 76 72 64 C 68 67 64 68 60 68 C 56 68 52 67 48 64 Z" fill="url(#hair-blond)" filter="url(#shadow-d)"/>
  <!-- Mustache -->
  <path d="M 60 59 C 54 55 45 61 42 66 C 48 68 55 64 60 62.5 C 65 64 72 68 78 66 C 75 61 66 55 60 59 Z" fill="url(#hair-blond)" stroke="#b45309" stroke-width="0.8"/>

  <!-- Princely Golden Helmet (Шелом) -->
  <path d="M 40 42 C 40 22 50 8 60 4 C 70 8 80 22 80 42 C 74 43 66 44 60 44 C 54 44 46 43 40 42 Z" fill="url(#helm-gold)" filter="url(#shadow-d)"/>
  <!-- Helmet Spire -->
  <path d="M 58 5 L 60 0 L 62 5 Z" fill="#fef08a"/>
  <circle cx="60" cy="0.5" r="1.5" fill="#fef08a"/>
  <!-- Ornate Filigree Patterns on Helmet -->
  <path d="M 60 4 L 60 44" stroke="#854d0e" stroke-width="1.5"/>
  <path d="M 48 28 Q 60 34 72 28" stroke="#854d0e" stroke-width="1.2" fill="none"/>
  <circle cx="60" cy="22" r="3" fill="#b91c1c" stroke="#854d0e" stroke-width="0.8"/>
  <!-- Helmet Brow Band -->
  <path d="M 39 40 Q 60 46 81 40 L 81 44 Q 60 50 39 44 Z" fill="#78350f"/>
  <path d="M 40 42 Q 60 47 80 42" stroke="#fde047" stroke-width="1.5" fill="none"/>
  <!-- Brow Nose Guard -->
  <path d="M 58.5 42 L 58.5 51 L 60 53 L 61.5 51 L 61.5 42 Z" fill="url(#helm-gold)" stroke="#78350f" stroke-width="0.5"/>
</svg>
