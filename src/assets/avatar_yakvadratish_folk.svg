<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-yak-folk" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="60%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </radialGradient>
    <linearGradient id="robe-silk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="35%" stop-color="#0369a1"/>
      <stop offset="70%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="gold-yak-f" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="skin-yak-f" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="60%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fba868"/>
    </linearGradient>
    <filter id="shadow-yak-f" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="60" cy="60" r="58" fill="url(#bg-yak-folk)" stroke="url(#gold-yak-f)" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="54" fill="none" stroke="#5eead4" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.65"/>

  <!-- Oriental Silk Robe Body -->
  <path d="M 20 116 C 20 88 34 78 60 78 C 86 78 100 88 100 116 Z" fill="url(#robe-silk)" filter="url(#shadow-yak-f)"/>
  <!-- Gold Embroidered Robe Trimming & Ornaments -->
  <path d="M 46 80 L 60 116 L 74 80 Z" fill="#b91c1c"/>
  <path d="M 44 80 L 58 116 M 76 80 L 62 116" stroke="url(#gold-yak-f)" stroke-width="3"/>
  <!-- Paisley / Floral Patterns on Robe -->
  <circle cx="34" cy="98" r="4" fill="url(#gold-yak-f)" opacity="0.8"/>
  <circle cx="86" cy="98" r="4" fill="url(#gold-yak-f)" opacity="0.8"/>
  <circle cx="38" cy="110" r="3" fill="#f43f5e" opacity="0.8"/>
  <circle cx="82" cy="110" r="3" fill="#f43f5e" opacity="0.8"/>

  <!-- Neck -->
  <path d="M 50 62 L 50 82 L 70 82 L 70 62 Z" fill="url(#skin-yak-f)"/>

  <!-- Face Base (Smiling Leonid) -->
  <path d="M 42 42 C 42 62 48 74 60 74 C 72 74 78 62 78 42 C 78 30 72 26 60 26 C 48 26 42 30 42 42 Z" fill="url(#skin-yak-f)" filter="url(#shadow-yak-f)"/>

  <!-- Eyebrows -->
  <path d="M 46 41 Q 52 37 57 41" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 74 41 Q 68 37 63 41" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Twinkling Eyes with Crow's Feet -->
  <ellipse cx="51.5" cy="46.5" rx="3.5" ry="2.3" fill="#fff"/>
  <circle cx="52" cy="46.5" r="1.6" fill="#1e293b"/>
  <circle cx="52.5" cy="45.8" r="0.6" fill="#fff"/>
  <ellipse cx="68.5" cy="46.5" rx="3.5" ry="2.3" fill="#fff"/>
  <circle cx="68" cy="46.5" r="1.6" fill="#1e293b"/>
  <circle cx="67.5" cy="45.8" r="0.6" fill="#fff"/>
  <path d="M 45 46 Q 43 47 44 49" stroke="#ea580c" stroke-width="0.8" opacity="0.4" fill="none"/>
  <path d="M 75 46 Q 77 47 76 49" stroke="#ea580c" stroke-width="0.8" opacity="0.4" fill="none"/>

  <!-- Rosy Cheeks -->
  <circle cx="45" cy="54" r="4" fill="#f87171" opacity="0.3"/>
  <circle cx="75" cy="54" r="4" fill="#f87171" opacity="0.3"/>

  <!-- Nose -->
  <path d="M 59 44 L 57 55 L 63 55 Z" fill="#ea580c" opacity="0.25"/>
  <path d="M 57 54 Q 60 56.5 63 54" stroke="#c2410c" stroke-width="1.3" fill="none" stroke-linecap="round"/>

  <!-- Broad Warm Smile -->
  <path d="M 52 61 Q 60 69 68 61" stroke="#991b1b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 53 61.5 Q 60 67 67 61.5 Q 60 64 53 61.5 Z" fill="#ffffff"/>

  <!-- MAGNIFICENT SIGNATURE DARK MUSTACHE -->
  <path d="M 60 56 C 54 50 40 54 36 62 C 44 65 53 60 60 58.5 C 67 60 76 65 84 62 C 80 54 66 50 60 56 Z" fill="#0f172a" stroke="#1e293b" stroke-width="1" filter="url(#shadow-yak-f)"/>
  <path d="M 44 60 Q 52 57 59 57.5 M 76 60 Q 68 57 61 57.5" stroke="#334155" stroke-width="1" fill="none"/>

  <!-- Velvet Tyubeteika with Fine Gold Embroidery -->
  <!-- Base Tyubeteika Cap -->
  <path d="M 38 34 C 40 22 50 18 60 18 C 70 18 80 22 82 34 C 74 36 66 37 60 37 C 54 37 46 36 38 34 Z" fill="#0f172a" filter="url(#shadow-yak-f)"/>
  <!-- Gold Embroidered Edge & Arabesques -->
  <path d="M 38 34 Q 60 40 82 34" stroke="url(#gold-yak-f)" stroke-width="2" fill="none"/>
  <!-- Gold Floral Motif on Cap -->
  <circle cx="60" cy="26" r="3.5" fill="url(#gold-yak-f)"/>
  <circle cx="60" cy="26" r="1.5" fill="#0f766e"/>
  <path d="M 52 28 Q 60 22 68 28" stroke="url(#gold-yak-f)" stroke-width="1.2" fill="none"/>
  <circle cx="50" cy="30" r="1.5" fill="url(#gold-yak-f)"/>
  <circle cx="70" cy="30" r="1.5" fill="url(#gold-yak-f)"/>

  <!-- Porcelain Tea Bowl (Пиала) with hot tea in lower right -->
  <g transform="translate(78, 86)" filter="url(#shadow-yak-f)">
    <!-- Bowl Body -->
    <path d="M 4 8 C 4 22 24 22 24 8 Z" fill="#f8fafc" stroke="url(#gold-yak-f)" stroke-width="1.5"/>
    <ellipse cx="14" cy="8" rx="10" ry="3" fill="#b45309"/>
    <!-- Steam Swirls -->
    <path d="M 11 4 Q 14 0 11 -4 M 17 4 Q 14 0 17 -4" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.6" stroke-linecap="round"/>
  </g>
</svg>
