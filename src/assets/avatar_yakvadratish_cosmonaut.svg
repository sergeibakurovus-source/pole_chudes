<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-yak-cosmos" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="suit-white" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="85%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="visor-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="skin-yak-c" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="60%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fba868"/>
    </linearGradient>
    <filter id="shadow-yak-c" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Cosmic Background Aura with Stars -->
  <circle cx="60" cy="60" r="58" fill="url(#bg-yak-cosmos)" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="60" cy="60" r="54" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.6"/>
  <!-- Distant Stars -->
  <circle cx="25" cy="25" r="1.2" fill="#fff" opacity="0.8"/>
  <circle cx="95" cy="30" r="1" fill="#fff" opacity="0.9"/>
  <circle cx="20" cy="85" r="0.8" fill="#38bdf8" opacity="0.8"/>
  <circle cx="102" cy="75" r="1.2" fill="#facc15" opacity="0.85"/>
  <circle cx="45" cy="12" r="0.7" fill="#fff" opacity="0.7"/>
  <circle cx="78" cy="10" r="0.9" fill="#fff" opacity="0.75"/>

  <!-- Spacesuit Shoulders Body -->
  <path d="M 18 116 C 18 86 34 78 60 78 C 86 78 102 86 102 116 Z" fill="url(#suit-white)" filter="url(#shadow-yak-c)"/>
  <!-- Suit Mission Insignia Stripes (Russian Tricolor / Blue-Red) -->
  <path d="M 38 88 L 48 116" stroke="#0284c7" stroke-width="3"/>
  <path d="M 82 88 L 72 116" stroke="#ef4444" stroke-width="3"/>
  <!-- Chest Control Box & Status Lights -->
  <rect x="52" y="92" width="16" height="18" rx="2" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <circle cx="56" cy="97" r="1.5" fill="#22c55e"/>
  <circle cx="64" cy="97" r="1.5" fill="#38bdf8"/>
  <circle cx="60" cy="103" r="2" fill="#eab308"/>

  <!-- Metallic Neck Ring / Helmet Seal -->
  <ellipse cx="60" cy="76" rx="26" ry="7" fill="#64748b" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow-yak-c)"/>
  <ellipse cx="60" cy="76" rx="23" ry="5" fill="#334155"/>

  <!-- Large Spherical Helmet Outer Dome -->
  <circle cx="60" cy="46" r="34" fill="url(#suit-white)" stroke="#94a3b8" stroke-width="2" filter="url(#shadow-yak-c)"/>

  <!-- Inner Helmet / Face Visible through Open Visor Frame -->
  <circle cx="60" cy="46" r="28" fill="#0f172a"/>

  <!-- Face Base (Leonid Yakvadratish inside helmet) -->
  <path d="M 44 42 C 44 58 50 68 60 68 C 70 68 76 58 76 42 C 76 34 70 30 60 30 C 50 30 44 34 44 42 Z" fill="url(#skin-yak-c)"/>

  <!-- Eyebrows -->
  <path d="M 47 41 Q 52 38 56 41" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 73 41 Q 68 38 64 41" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Twinkling Eyes -->
  <ellipse cx="51.5" cy="45.5" rx="3" ry="2" fill="#fff"/>
  <circle cx="52" cy="45.5" r="1.4" fill="#1e293b"/>
  <circle cx="52.4" cy="44.9" r="0.5" fill="#fff"/>
  <ellipse cx="68.5" cy="45.5" rx="3" ry="2" fill="#fff"/>
  <circle cx="68" cy="45.5" r="1.4" fill="#1e293b"/>
  <circle cx="67.6" cy="44.9" r="0.5" fill="#fff"/>

  <!-- Rosy Cheeks -->
  <circle cx="46" cy="52" r="3" fill="#f87171" opacity="0.3"/>
  <circle cx="74" cy="52" r="3" fill="#f87171" opacity="0.3"/>

  <!-- Nose -->
  <path d="M 58 52 Q 60 54 62 52" stroke="#c2410c" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- Joyful Smile -->
  <path d="M 53 58 Q 60 64 67 58" stroke="#991b1b" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M 54 58.5 Q 60 63 66 58.5 Q 60 60.5 54 58.5 Z" fill="#ffffff"/>

  <!-- SIGNATURE LUSH DARK MUSTACHE -->
  <path d="M 60 53 C 54 48 42 51 38 58 C 45 61 54 56.5 60 55.5 C 66 56.5 75 61 82 58 C 78 51 66 48 60 53 Z" fill="#0f172a" stroke="#1e293b" stroke-width="0.8"/>

  <!-- Headset / Comms Microphone inside Helmet -->
  <path d="M 74 46 L 76 56 L 68 59" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <circle cx="68" cy="59" r="1.5" fill="#38bdf8"/>

  <!-- Golden Visor Rim & Upper Shield with Star Reflection -->
  <path d="M 34 36 C 36 20 46 16 60 16 C 74 16 84 20 86 36 C 76 33 66 32 60 32 C 54 32 44 33 34 36 Z" fill="url(#visor-gold)" filter="url(#glow-gold)" opacity="0.95"/>
  <!-- Visor Glass Reflection Arc -->
  <path d="M 37 32 Q 60 22 83 32" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- Visor Side Hinges -->
  <circle cx="32" cy="46" r="3.5" fill="#64748b" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="88" cy="46" r="3.5" fill="#64748b" stroke="#94a3b8" stroke-width="1"/>
</svg>
